name: horilla_mobile
description: Horilla HR — your workday, in your pocket.
publish_to: 'none'

# Kept in step with android/app/build.gradle.kts. The Play listing already
# exists, so versionCode must only ever increase; check the Play Console for
# the live number before a release rather than trusting either file.
version: 2.0.0+12

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State. Plain providers, no codegen: most screens are read-mostly server
  # data, and AsyncValue's three states map onto the design's
  # skeleton / error / data without a build_runner in the loop.
  flutter_riverpod: ^3.0.1

  # Navigation. StatefulShellRoute.indexedStack is the reason -- it keeps a
  # tab lit across pushed detail screens, which is the design's nav model.
  go_router: ^16.2.4

  # HTTP. The interceptor stack is the whole networking design.
  dio: ^5.9.0

  # Tokens live in the Keychain/Keystore, never in shared_preferences.
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  local_auth: ^2.3.0          # biometric re-entry gate, not an auth factor
  geolocator: ^14.0.2         # coordinates sent with a punch
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - Assets/

  # Bundled, not fetched. google_fonts downloads at runtime, which costs a
  # round trip before first paint and breaks typography offline.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: Assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: Assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: Assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: Assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: Assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: Assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: Assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: Assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
